name: Enrolment rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  enrolment-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run the enrolment rules suite
        run: >
          newman run collections/enrolment-rules.postman_collection.json
          --env-var apiKey=${{ secrets.CAMPUS_KEY }}
          -r cli,junit
          --reporter-junit-export results/enrolment-rules.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrolment-rules-report
          path: results/enrolment-rules.xml
